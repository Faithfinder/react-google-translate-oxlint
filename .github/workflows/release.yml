name: Release

# Publishes the version in package.json when a v* tag is pushed. Provenance
# requires the id-token permission below and a public package.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Fail if the tag does not match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          }
      # Tags are useful on their own as a stable ref for git installs, so a
      # missing token is a skip rather than a failure.
      - name: Skip publish when no npm token is configured
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not set - tag created, publish skipped."
      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
